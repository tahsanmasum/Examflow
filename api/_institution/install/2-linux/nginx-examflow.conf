# HTTPS in front of ExamFlow with nginx. Copy to /etc/nginx/sites-available/examflow (Debian/Ubuntu)
# or /etc/nginx/conf.d/examflow.conf (RHEL), change the domain and certificate paths, then:
#   nginx -t && systemctl reload nginx
# Free certificate:  certbot --nginx -d examflow.your-university.edu
server {
    listen 80;
    server_name examflow.your-university.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name examflow.your-university.edu;
    ssl_certificate     /etc/letsencrypt/live/examflow.your-university.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examflow.your-university.edu/privkey.pem;
    client_max_body_size 3m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
