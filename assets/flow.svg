<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="t d">
<title id="t">How an exam flows</title><desc id="d">Create, share, take, monitor, grade, export.</desc>
<style>@font-face{font-family:'FrauncesD';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Jakarta';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Mono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.disp{font-family:FrauncesD,Georgia,serif}.sans{font-family:Jakarta,system-ui,sans-serif}.mono{font-family:Mono,ui-monospace,monospace}
.dot{animation:travel 6.0s cubic-bezier(.45,0,.55,1) infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(980px);opacity:0}}
.ring{opacity:0;animation:ring 6.0s ease-out infinite}
@keyframes ring{0%{opacity:0}3%{opacity:1}14%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:0}.ring{animation:none}}
</style>
<rect x=".5" y=".5" width="1199" height="239" rx="22" fill="#faf9f6" stroke="#e4ded3"/>
<line x1="110" y1="98" x2="1090" y2="98" stroke="#e4ded3" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
<circle cx="110" cy="98" r="6" fill="#c8401a" class="dot"/>
<g transform="translate(110 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:-0.15s"/><path d="M-9 -9h12l6 6v12h-18zM3 -9v6h6M-4 2h8M-4 7h5" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="110" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">01</text><text x="110" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Create</text><text x="110" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">MCQ, written or</text><text x="110" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">combined, or a CSV</text><g transform="translate(306 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:0.85s"/><path d="M-3 3a5 5 0 0 1 0-7l3-3a5 5 0 0 1 7 7l-1.5 1.5M3 -3a5 5 0 0 1 0 7l-3 3a5 5 0 0 1-7-7l1.5-1.5" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">02</text><text x="306" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Share</text><text x="306" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">One link or a QR</text><text x="306" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">code for the class</text><g transform="translate(502 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:1.85s"/><path d="M-6 -10h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-16a2 2 0 0 1 2-2zM-2 7h4" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="502" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">03</text><text x="502" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Take</text><text x="502" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">No account needed;</text><text x="502" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">anti-cheat stays on</text><g transform="translate(698 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:2.85s"/><path d="M-10 8h20M-7 4v-6M-2 4v-11M3 4v-3M8 4v-8" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="698" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">04</text><text x="698" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Monitor</text><text x="698" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">Live progress, flags</text><text x="698" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">and violations</text><g transform="translate(894 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:3.85s"/><path d="M-9 9l3-1 11-11-2-2-11 11zM4 -7l2-2 2 2-2 2" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="894" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">05</text><text x="894" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Grade</text><text x="894" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">MCQ marks itself;</text><text x="894" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">red-pen the written</text><g transform="translate(1090 98)"><circle r="34" fill="#fff" stroke="#e4ded3" stroke-width="1.5"/><circle r="34" fill="none" stroke="#c8401a" stroke-width="2" class="ring" style="animation-delay:4.85s"/><path d="M0 -9v12M-5 -2l5 5 5-5M-9 7v2h18v-2" fill="none" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1090" y="48" class="mono" font-size="12" fill="#8a8378" text-anchor="middle">06</text><text x="1090" y="164" class="disp" font-size="21" font-weight="500" fill="#0f0e0d" text-anchor="middle">Export</text><text x="1090" y="188" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">CSV, PDF and</text><text x="1090" y="206" class="sans" font-size="13" fill="#5c564c" text-anchor="middle">student review links</text>
</svg>